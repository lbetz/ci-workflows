name: Build RPM (Reusable)

on:
  workflow_call:
    inputs:
      ci_workflows_ref:
        type: string
        default: "main"
      distros:
        type: string
        required: true
      architectures:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-rpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
        arch:   ${{ fromJSON(inputs.architectures) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ci-workflows
        uses: actions/checkout@v4
        with:
          repository: lbetz/ci-workflows
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows

      - name: Map arch to platform
        id: platform
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x86_64)  echo "platform=linux/amd64"   >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64"   >> "$GITHUB_OUTPUT" ;;
            ppc64le) echo "platform=linux/ppc64le" >> "$GITHUB_OUTPUT" ;;
            s390x)   echo "platform=linux/s390x"   >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported arch"; exit 1 ;;
          esac

      - name: Setup QEMU
        if: steps.platform.outputs.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.platform.outputs.platform }}

      - name: Runner build tools
        run: bash .ci-workflows/hooks/pre_build_in_runner.sh

      - name: Resolve container image
        id: image
        run: |
          source .ci-workflows/hooks/lib/container_images.sh
          echo "image=$(get_container_image '${{ matrix.distro }}')" >> "$GITHUB_OUTPUT"

      - name: Build RPM in container
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM:        ${{ steps.platform.outputs.platform }}
          TARGET_ARCH:     ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p rpmbuild
          docker run --rm \
            --platform "$PLATFORM" \
            -e TARGET_ARCH \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            /bin/bash /workspace/.ci-workflows/hooks/rpmbuild_in_container.sh

      - name: Collect & rename artifacts
        run: |
          set -euo pipefail
          mkdir -p out/bin out/src

          DISTRO="${{ matrix.distro }}"

          # Binär-RPMs
          for f in rpmbuild/RPMS/**/*.rpm; do
            base=$(basename "$f")
            new="${base%.rpm}.${DISTRO}.rpm"
            cp -v "$f" "out/bin/$new"
          done

          # Source-RPMs
          for f in rpmbuild/SRPMS/*.src.rpm; do
            base=$(basename "$f")
            new="${base%.src.rpm}.${DISTRO}.src.rpm"
            cp -v "$f" "out/src/$new"
          done

          ls -la out/bin
          ls -la out/src

      - name: Upload binary RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpm-bin-${{ matrix.distro }}-${{ matrix.arch }}
          path: out/bin/*.rpm
          if-no-files-found: error

      - name: Upload source RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpm-src-${{ matrix.distro }}-${{ matrix.arch }}
          path: out/src/*.rpm
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
        arch:   ${{ fromJSON(inputs.architectures) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ci-workflows
        uses: actions/checkout@v4
        with:
          repository: lbetz/ci-workflows
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows

      - name: Download binary RPMs
        uses: actions/download-artifact@v4
        with:
          name: rpm-bin-${{ matrix.distro }}-${{ matrix.arch }}
          path: rpms

      - name: Map arch to platform
        id: platform
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x86_64)  echo "platform=linux/amd64"   >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64"   >> "$GITHUB_OUTPUT" ;;
            ppc64le) echo "platform=linux/ppc64le" >> "$GITHUB_OUTPUT" ;;
            s390x)   echo "platform=linux/s390x"   >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported arch"; exit 1 ;;
          esac

      - name: Setup QEMU
        if: steps.platform.outputs.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.platform.outputs.platform }}

      - name: Runner test tools
        run: bash .ci-workflows/hooks/pre_test_in_runner.sh

      - name: Resolve container image
        id: image
        run: |
          source .ci-workflows/hooks/lib/container_images.sh
          echo "image=$(get_container_image '${{ matrix.distro }}')" >> "$GITHUB_OUTPUT"

      - name: Install & test RPM in container
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM:        ${{ steps.platform.outputs.platform }}
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            /bin/bash /workspace/.ci-workflows/hooks/rpmtest_in_container.sh

