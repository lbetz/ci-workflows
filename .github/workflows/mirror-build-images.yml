name: Mirror Build Images To GHCR

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-build-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      DOCKER_CONFIG: /tmp/.docker

    steps:
      - name: Checkout ci-workflows
        uses: actions/checkout@v4

      - name: Prepare Docker config directory
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Resolve source image list
        id: images
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t images <<'EOF'
          almalinux:8
          almalinux:9
          almalinux:10
          fedora:43
          fedora:44
          debian:11
          debian:12
          debian:13
          ubuntu:22.04
          ubuntu:24.04
          EOF

          if (( ${#images[@]} == 0 )); then
            echo "No source images found in hooks/lib/container_images.sh" >&2
            exit 1
          fi

          {
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Source images"
            printf -- '- `%s`\n' "${images[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror images to GHCR
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r src; do
            [[ -n "$src" ]] || continue

            src_no_digest="${src%@*}"

            if [[ "$src_no_digest" == *:* ]]; then
              repo="${src_no_digest%:*}"
              tag="${src_no_digest##*:}"
            else
              repo="$src_no_digest"
              tag="latest"
            fi

            repo="${repo#docker.io/}"
            repo="${repo#library/}"

            dst="ghcr.io/pkging/build-images/${repo}:${tag}"

            echo "Mirroring $src -> $dst"
            crane copy "$src" "$dst"
            crane digest "$dst"
          done <<< "${{ steps.images.outputs.images }}"

      - name: Write result summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Destination pattern"
            echo "- `ghcr.io/pkging/build-images/<name>:<tag>`"
            echo ""
            echo "To use these images in CI, map distro keys to GHCR references in hooks/lib/container_images.sh."
          } >> "$GITHUB_STEP_SUMMARY"
