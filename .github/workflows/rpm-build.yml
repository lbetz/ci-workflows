name: Build RPM (Reusable)

on:
  workflow_call:
    inputs:
      distros:
        description: "Liste unterstützter Distributionen"
        required: true
        type: string
      architectures:
        description: "Liste unterstützter Architekturen"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
        arch: ${{ fromJSON(inputs.architectures) }}

    steps:
      - name: Checkout project source
        uses: actions/checkout@v4

      - name: Checkout lbetz/ci-workflows (for hooks and helpers)
        uses: actions/checkout@v4
        with:
          repository: lbetz/ci-workflows
          ref: main
          path: .ci-workflows

      - name: Setup build environment
        run: |
          set -e
          echo "[SETUP] Preparing build tools..."
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y rpm createrepo-c
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y rpm-build createrepo_c
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y rpm-build createrepo_c
          else
            echo "⚠️ Kein bekanntes Paketmanagementsystem gefunden!"
          fi
      
          chmod +x .ci-workflows/hooks/*.sh || true
          chmod +x .ci-workflows/hooks/lib/*.sh || true
          chmod +x .github/hooks/*.sh 2>/dev/null || true

      - name: Run predefined hook chain (only build phase)
        run: |
          set -e
          HOOKS=("pre_build" "post_build")   # pre_test / post_test hier entfernen!

          for HOOK in "${HOOKS[@]}"; do
            GLOBAL_HOOK=".ci-workflows/hooks/${HOOK}.sh"
            LOCAL_HOOK=".github/hooks/${HOOK}.sh"

            if [ -f "$GLOBAL_HOOK" ]; then
              echo "[CI] Executing global hook: $GLOBAL_HOOK"
              bash "$GLOBAL_HOOK"
            fi

            if [ -f "$LOCAL_HOOK" ]; then
              echo "[CI] Executing project hook: $LOCAL_HOOK"
              bash "$LOCAL_HOOK"
            fi
          done

      - name: Build RPM
        run: |
          set -e
          distro=${{ matrix.distro }}
          arch=${{ matrix.arch }}
          echo "[BUILD] Running rpm build for ${distro}-${arch}"
      
          # Container-Image ermitteln (wie zuvor)
          case "$distro" in
            el8) container_image="almalinux:8" ;;
            el9) container_image="almalinux:9" ;;
            el10) container_image="almalinux:10" ;;
            fedora43) container_image="fedora:43" ;;
            fedora44) container_image="fedora:44" ;;
            *)          container_image="almalinux:9" ;;
          esac
      
          docker run --rm -v "$PWD":/src "$container_image" /bin/bash -c '
            set -e
            dnf install -y --allowerasing rpm-build redhat-rpm-config git tar gzip
      
            cd /src
            SPEC_FILE=$(find . -name "*.spec" | head -n 1)
            if [[ -z "$SPEC_FILE" ]]; then
              echo "❌ Keine .spec-Datei gefunden" >&2
              exit 1
            fi
      
            echo "[INFO] Verwende SPEC-Datei: $SPEC_FILE"
      
            NAME=$(grep -E "^Name:" "$SPEC_FILE" | awk "{print \$2}")
            VERSION=$(grep -E "^Version:" "$SPEC_FILE" | awk "{print \$2}")
            SOURCE_URL=$(grep -E "^Source0:" "$SPEC_FILE" | awk "{\$1=\"\"; print substr(\$0,2)}")
            RESOLVED_SOURCE=$(echo "$SOURCE_URL" | sed "s|%{version}|$VERSION|g")
      
            echo "[INFO] Name: $NAME"
            echo "[INFO] Version: $VERSION"
            echo "[INFO] Source URL: $RESOLVED_SOURCE"
      
            # Optional: lade Source herunter (wenn nicht im SOURCES-Verzeichnis vorhanden)
            mkdir -p SOURCES
            cd SOURCES
            if [[ ! -f $(basename "$RESOLVED_SOURCE") ]]; then
              echo "[DOWNLOAD] Lade Quellpaket herunter..."
              curl -fsSL -O "$RESOLVED_SOURCE"
            else
              echo "[INFO] Source bereits vorhanden."
            fi
            cd ..
      
            # RPM bauen
            echo "[BUILD] Starte rpmbuild..."
            rpmbuild -ba --define "_topdir /src" "$SPEC_FILE"
          '

      - name: Test RPM
        run: |
          distro=${{ matrix.distro }}
          arch=${{ matrix.arch }}
      
          # Container-Image ermitteln (wie zuvor)
          case "$distro" in
            el8) container_image="almalinux:8" ;;
            el9) container_image="almalinux:9" ;;
            el10) container_image="almalinux:10" ;;
            fedora43) container_image="fedora:43" ;;
            fedora44) container_image="fedora:44" ;;
            *)          container_image="almalinux:9" ;;
          esac
      
          docker run --rm -v "$PWD":/src "$container_image" /bin/bash -c '
            set -e
            # führe globale und projekt-hooks IM container aus – falls vorhanden
            if [ -f /src/.ci-workflows/hooks/pre_test.sh ]; then
              bash /src/.ci-workflows/hooks/pre_test.sh
            fi
            if [ -f /src/.github/hooks/pre_test.sh ]; then
              bash /src/.github/hooks/pre_test.sh
            fi
      
            echo "[TEST] Installing built RPM..."
            dnf install -y --allowerasing --nobest /src/RPMS/x86_64/*.rpm
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}-${{ matrix.arch }}
          path: RPMS/${{ matrix.arch }}/*.rpm

