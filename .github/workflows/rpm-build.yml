name: Build RPM (Reusable)

on:
  workflow_call:
    inputs:
      ci_workflows_ref:
        description: "Branch oder Tag für ci-workflows"
        required: false
        default: "main"
        type: string
      distros:
        description: "Liste unterstützter Distributionen (JSON)"
        required: true
        type: string
      architectures:
        description: "Liste unterstützter Architekturen (JSON)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-rpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
        arch: ${{ fromJSON(inputs.architectures) }}

    steps:
      - name: Checkout project source
        uses: actions/checkout@v4

      - name: Checkout lbetz/ci-workflows (hooks, helpers, container scripts)
        uses: actions/checkout@v4
        with:
          repository: lbetz/ci-workflows
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows

      - name: Map arch to docker platform
        id: platform
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x86_64)  echo "platform=linux/amd64"   >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64"   >> "$GITHUB_OUTPUT" ;;
            ppc64le) echo "platform=linux/ppc64le" >> "$GITHUB_OUTPUT" ;;
            s390x)   echo "platform=linux/s390x"   >> "$GITHUB_OUTPUT" ;;
            *)
              echo "❌ Unsupported arch: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac

      - name: Set up QEMU (for cross-arch builds)
        if: steps.platform.outputs.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.platform.outputs.platform }}

      - name: Setup runner build tools (runner hooks)
        run: |
          set -euo pipefail
          bash .ci-workflows/hooks/pre_build_in_runner.sh

      - name: Resolve container image
        id: image
        run: |
          set -euo pipefail
          source "$PWD/.ci-workflows/hooks/lib/container_images.sh"
          image=$(get_container_image "${{ matrix.distro }}")
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build RPM in container
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM:        ${{ steps.platform.outputs.platform }}
          TARGET_ARCH:     ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/rpmbuild"
          docker run --rm \
            --platform "${PLATFORM}" \
            -e TARGET_ARCH \
            -v "${GITHUB_WORKSPACE}":/workspace \
            -w /workspace \
            "${CONTAINER_IMAGE}" \
            /bin/bash /workspace/.ci-workflows/hooks/rpmbuild_in_container.sh

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find rpmbuild/RPMS -type f -name "*.rpm" -exec cp -v {} out/ \;
          ls -la out/

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}-${{ matrix.arch }}
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
        arch: ${{ fromJSON(inputs.architectures) }}

    steps:
      - name: Checkout project source
        uses: actions/checkout@v4

      - name: Checkout ci-workflows
        uses: actions/checkout@v4
        with:
          repository: lbetz/ci-workflows
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}-${{ matrix.arch }}
          path: rpms

      - name: Map arch to docker platform
        id: platform
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x86_64)  echo "platform=linux/amd64"   >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64"   >> "$GITHUB_OUTPUT" ;;
            ppc64le) echo "platform=linux/ppc64le" >> "$GITHUB_OUTPUT" ;;
            s390x)   echo "platform=linux/s390x"   >> "$GITHUB_OUTPUT" ;;
            *) echo "❌ Unsupported arch"; exit 1 ;;
          esac

      - name: Set up QEMU
        if: steps.platform.outputs.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.platform.outputs.platform }}

      - name: Setup runner test tools (runner hooks)
        run: |
          set -euo pipefail
          bash .ci-workflows/hooks/pre_test_in_runner.sh

      - name: Resolve container image
        id: image
        run: |
          set -euo pipefail
          source "$PWD/.ci-workflows/hooks/lib/container_images.sh"
          echo "image=$(get_container_image "${{ matrix.distro }}")" >> "$GITHUB_OUTPUT"

      - name: Install & smoke-test RPM in container
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM:        ${{ steps.platform.outputs.platform }}
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "${PLATFORM}" \
            -v "${GITHUB_WORKSPACE}":/workspace \
            -w /workspace \
            "${CONTAINER_IMAGE}" \
            /bin/bash /workspace/.ci-workflows/hooks/rpmtest_in_container.sh

