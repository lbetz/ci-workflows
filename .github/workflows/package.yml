name: Package Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      ci_workflows_ref:
        type: string
        default: "main"
      matrix:
        type: string
        required: true
      source_event_name:
        type: string
        default: ""
      source_ref_name:
        type: string
        default: ""
      source_ref_type:
        type: string
        default: ""
      run_upload:
        type: boolean
        default: false
      sign_packages:
        type: boolean
        default: true
      runner_labels:
        type: string
        default: '["ubuntu-latest"]'
      rpm_artifact_pattern:
        type: string
        default: "bin-*"
      deb_artifact_pattern:
        type: string
        default: "bin-*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}

    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      upload: ${{ steps.check.outputs.upload }}
      matrix: ${{ steps.expand.outputs.matrix }}
      upload_matrix: ${{ steps.expand.outputs.upload_matrix }}

    steps:
      - name: Validate event and tag pattern
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ inputs.source_event_name != '' && inputs.source_event_name || github.event_name }}
          REF_NAME: ${{ inputs.source_ref_name != '' && inputs.source_ref_name || github.ref_name }}
          REF_TYPE: ${{ inputs.source_ref_type != '' && inputs.source_ref_type || github.ref_type }}
          RUN_UPLOAD: ${{ inputs.run_upload }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            if [[ "$RUN_UPLOAD" == "true" ]]; then
              echo "upload=true" >> "$GITHUB_OUTPUT"
            else
              echo "upload=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "upload=true" >> "$GITHUB_OUTPUT"
            else
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "upload=false" >> "$GITHUB_OUTPUT"
              echo "Tag $REF_NAME does not match <semver>, <semver>-<text>, v<semver>, or v<semver>-<text>" >&2
            fi
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "upload=false" >> "$GITHUB_OUTPUT"

      - name: Expand compact matrix
        id: expand
        if: steps.check.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'EOF'
          import json
          import os
          import textwrap

          TARGET_MAP = {
              "el8": {"target_type": "rpm", "target_family": "epel", "target_version": "8"},
              "el9": {"target_type": "rpm", "target_family": "epel", "target_version": "9"},
              "el10": {"target_type": "rpm", "target_family": "epel", "target_version": "10"},
              "fedora43": {"target_type": "rpm", "target_family": "fedora", "target_version": "43"},
              "fedora44": {"target_type": "rpm", "target_family": "fedora", "target_version": "44"},
              "debian11": {"target_type": "apt", "target_family": "debian", "target_version": "bullseye"},
              "debian12": {"target_type": "apt", "target_family": "debian", "target_version": "bookworm"},
              "debian13": {"target_type": "apt", "target_family": "debian", "target_version": "trixie"},
              "ubuntu22": {"target_type": "apt", "target_family": "ubuntu", "target_version": "jammy"},
              "ubuntu24": {"target_type": "apt", "target_family": "ubuntu", "target_version": "noble"},
          }

          def parse_scalar(value: str) -> str:
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
                  return value[1:-1]
              return value


          def parse_inline_list(value: str) -> list[str]:
              inner = value[1:-1].strip()
              if not inner:
                  return []
              return [parse_scalar(part) for part in inner.split(",") if part.strip()]


          def parse_simple_matrix(raw_text: str) -> dict[str, str | list[str]]:
              parsed: dict[str, str | list[str]] = {}
              current_key = None

              for raw_line in textwrap.dedent(raw_text).splitlines():
                  line = raw_line.rstrip()
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      continue

                  indent = len(raw_line) - len(raw_line.lstrip(" "))
                  if indent == 0:
                      if ":" not in stripped:
                          raise ValueError(f"Unsupported matrix line: {raw_line!r}")

                      key, value = stripped.split(":", 1)
                      key = key.strip()
                      value = value.strip()
                      if not key:
                          raise ValueError(f"Missing matrix key in line: {raw_line!r}")

                      if not value:
                          parsed[key] = []
                          current_key = key
                      elif value.startswith("[") and value.endswith("]"):
                          parsed[key] = parse_inline_list(value)
                          current_key = None
                      else:
                          parsed[key] = parse_scalar(value)
                          current_key = None
                      continue

                  if current_key is None or not stripped.startswith("- "):
                      raise ValueError(f"Unsupported matrix line: {raw_line!r}")

                  current_value = parsed[current_key]
                  if not isinstance(current_value, list):
                      raise ValueError(f"Matrix key {current_key!r} does not accept list items")
                  current_value.append(parse_scalar(stripped[2:]))

              return parsed


          raw_yaml = textwrap.dedent("""${{ inputs.matrix }}""").strip()
          if raw_yaml.startswith("{"):
              raw = json.loads(raw_yaml)
          else:
              raw = parse_simple_matrix(raw_yaml)

          if not isinstance(raw, dict):
              raise ValueError("Matrix input must be a mapping of distro names to architectures")

          expanded = {"include": []}
          upload_targets = {}

          for distro, archs in raw.items():
              if distro not in TARGET_MAP:
                  raise ValueError(f"Unknown distro {distro!r}. Add it to TARGET_MAP in package.yml before using it.")

              target = TARGET_MAP[distro]

              if isinstance(archs, str):
                  archs = [archs]
              elif not isinstance(archs, list):
                  raise ValueError(f"Matrix value for {distro!r} must be a string or list")
              for arch in archs:
                  expanded["include"].append({
                      "distro": distro,
                      "arch": arch,
                      "target_type": target["target_type"],
                      "target_family": target["target_family"],
                      "target_version": target["target_version"],
                  })

              upload_targets[distro] = {
                  "distro": distro,
                  "target_type": target["target_type"],
                  "target_family": target["target_family"],
                  "target_version": target["target_version"],
              }

          upload_matrix = {"include": list(upload_targets.values())}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps(expanded)}\n")
              handle.write(f"upload_matrix={json.dumps(upload_matrix)}\n")
          EOF

  build:
    needs: [prepare]
    if: needs.prepare.outputs.allowed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ci_workflows_ref: ${{ inputs.ci_workflows_ref }}
      matrix: ${{ needs.prepare.outputs.matrix }}
      runner_labels: ${{ inputs.runner_labels }}

  sign:
    needs: [prepare, build]
    if: needs.prepare.outputs.allowed == 'true' && needs.prepare.outputs.upload == 'true' && inputs.sign_packages
    runs-on: ${{ fromJSON(inputs.runner_labels) }}

    steps:
      - name: Checkout ci-workflows
        uses: actions/checkout@v4
        with:
          repository: pkging/ci-workflows
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows

      - name: Preflight runner requirements
        env:
          PACKAGE_SIGNING_PRIVATE_KEY: ${{ secrets.PACKAGE_SIGNING_PRIVATE_KEY }}
          PACKAGE_SIGNING_KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
        run: bash .ci-workflows/hooks/preflight_in_runner.sh sign

      - name: Download artifacts to sign
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.rpm_artifact_pattern }}
          path: dist/unsigned
          merge-multiple: true

      - name: Download DEB artifacts to sign
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.deb_artifact_pattern }}
          path: dist/unsigned
          merge-multiple: true

      - name: Install signing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm gnupg

          # Ubuntu images can differ: try dpkg-sig first, then fall back to debsigs.
          if ! sudo apt-get install -y --no-install-recommends dpkg-sig; then
            echo "dpkg-sig not available on this runner image, trying debsigs..."
            sudo apt-get install -y --no-install-recommends debsigs
          fi

      - name: Import signing key
        env:
          PACKAGE_SIGNING_PRIVATE_KEY: ${{ secrets.PACKAGE_SIGNING_PRIVATE_KEY }}
          PACKAGE_SIGNING_KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          : "${PACKAGE_SIGNING_PRIVATE_KEY:?PACKAGE_SIGNING_PRIVATE_KEY secret is required when sign_packages=true}"
          : "${PACKAGE_SIGNING_KEY_ID:?PACKAGE_SIGNING_KEY_ID secret is required when sign_packages=true}"
          echo "Using package signing key ID: ${PACKAGE_SIGNING_KEY_ID}"
          printf '%s\n' "$PACKAGE_SIGNING_PRIVATE_KEY" > signing.key.asc
          gpg --batch --import signing.key.asc

      - name: Sign RPM packages
        env:
          PACKAGE_SIGNING_KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          : "${PACKAGE_SIGNING_KEY_ID:?PACKAGE_SIGNING_KEY_ID secret is required when sign_packages=true}"
          echo "Signing RPM packages with key ID: ${PACKAGE_SIGNING_KEY_ID}"

          {
            printf '%%_signature gpg\n'
            printf '%%_gpg_name %s\n' "${PACKAGE_SIGNING_KEY_ID}"
            printf '%%__gpg /usr/bin/gpg\n'
            printf '%%__gpg_sign_cmd %%{__gpg} --batch --yes --no-armor --digest-algo sha256 --detach-sign --output %%{__signature_filename} %%{__plaintext_filename}\n'
          } > ~/.rpmmacros

          shopt -s nullglob
          rpms=(dist/unsigned/*.rpm)
          if (( ${#rpms[@]} > 0 )); then
            for pkg in "${rpms[@]}"; do
              rpmsign --addsign "$pkg"
            done
          fi

      - name: Sign DEB packages
        env:
          PACKAGE_SIGNING_KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          : "${PACKAGE_SIGNING_KEY_ID:?PACKAGE_SIGNING_KEY_ID secret is required when sign_packages=true}"
          echo "Signing DEB packages with key ID: ${PACKAGE_SIGNING_KEY_ID}"

          shopt -s nullglob
          debs=(dist/unsigned/*.deb)
          if (( ${#debs[@]} > 0 )); then
            if command -v dpkg-sig >/dev/null 2>&1; then
              export DEBSIGN_PROGRAM='gpg --batch --yes'
              for pkg in "${debs[@]}"; do
                dpkg-sig -k "${PACKAGE_SIGNING_KEY_ID}" --sign builder "$pkg"
              done
            elif command -v debsigs >/dev/null 2>&1; then
              for pkg in "${debs[@]}"; do
                debsigs --sign=origin --default-key "${PACKAGE_SIGNING_KEY_ID}" "$pkg"
              done
            else
              echo "No DEB signing tool available (dpkg-sig/debsigs)" >&2
              exit 1
            fi
          fi

      - name: Collect signed artifacts
        run: |
          set -euo pipefail
          mkdir -p out/bin
          shopt -s nullglob
          for f in dist/unsigned/*.rpm dist/unsigned/*.deb; do
            cp -v "$f" out/bin/
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-bin-packages
          path: out/bin/*
          if-no-files-found: error

  upload:
    needs: [prepare, build, sign]
    if: always() && needs.prepare.outputs.allowed == 'true' && needs.prepare.outputs.upload == 'true' && (!inputs.sign_packages || needs.sign.result == 'success')
    uses: ./.github/workflows/pulp-upload.yml
    with:
      ci_workflows_ref: ${{ inputs.ci_workflows_ref }}
      runner_labels: ${{ inputs.runner_labels }}
      matrix: ${{ needs.prepare.outputs.upload_matrix }}
      rpm_artifact_pattern: ${{ inputs.sign_packages && 'signed-bin-packages' || inputs.rpm_artifact_pattern }}
      deb_artifact_pattern: ${{ inputs.sign_packages && 'signed-bin-packages' || inputs.deb_artifact_pattern }}
    secrets: inherit
