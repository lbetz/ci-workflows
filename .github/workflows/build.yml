name: Package Build (Reusable)

on:
  workflow_call:
    inputs:
      ci_workflows_ref:
        type: string
        default: "main"
      matrix:
        type: string
        required: true
      runner_labels:
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    env:
      DOCKER_CONFIG: /tmp/.docker

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ci-workflows
        uses: actions/checkout@v4
        with:
          repository: pkging/ci-workflows
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows

      - name: Preflight runner requirements
        run: bash .ci-workflows/hooks/preflight_in_runner.sh build "${{ matrix.arch }}"

      - name: Debug list ci-workflows
        run: |
          echo "PWD: $PWD"
          echo "Listing workspace root:"
          ls -la
          echo "Listing .ci-workflows:"
          ls -Rla .ci-workflows || true

      - name: Map arch to platform
        id: platform
        run: |
          set -euo pipefail
          # source the helper from the checked-out ci-workflows
          source .ci-workflows/hooks/lib/platforms.sh

          if platform=$(map_arch_to_platform "${{ matrix.arch }}"); then
            echo "platform=$platform" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported arch: ${{ matrix.arch }}" >&2
            exit 1
          fi

      - name: Setup QEMU
        if: steps.platform.outputs.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.platform.outputs.platform }}

      - name: Runner build tools
        run: bash .ci-workflows/hooks/pre_build_in_runner.sh

      - name: Resolve container image
        id: image
        run: |
          set -euo pipefail
          source .ci-workflows/hooks/lib/container_images.sh
          image="$(get_container_image '${{ matrix.distro }}')"
          if [[ -z "$image" ]]; then
            echo "Container image mapping returned empty for distro: ${{ matrix.distro }}" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker config directory
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package in container
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM:        ${{ steps.platform.outputs.platform }}
          TARGET_ARCH:     ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p rpmbuild
          docker run --rm \
            --platform "$PLATFORM" \
            -e TARGET_ARCH \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            /bin/bash /workspace/.ci-workflows/hooks/build_in_container.sh

      - name: Collect & rename artifacts
        run: |
          set -euo pipefail
          mkdir -p out/bin out/src

          DISTRO="${{ matrix.distro }}"

          # Detect package format
          if [[ -d rpmbuild/RPMS ]]; then
            FORMAT="rpm"
          elif ls ./*.deb >/dev/null 2>&1; then
            FORMAT="deb"
          else
            echo "❌ No RPM or DEB artifacts found" >&2
            exit 1
          fi

          echo "Detected package format: $FORMAT"

          if [[ "$FORMAT" == "rpm" ]]; then
            # Binär-RPMs
            find rpmbuild/RPMS -type f -name '*.rpm' -print0 | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              new="${base%.rpm}.${DISTRO}.rpm"
              cp -v "$f" "out/bin/$new"
            done

            # Source-RPMs
            find rpmbuild/SRPMS -type f -name '*.src.rpm' -print0 | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              new="${base%.src.rpm}.${DISTRO}.src.rpm"
              cp -v "$f" "out/src/$new"
            done
          else
            # DEB packages
            for f in ./*.deb; do
              base=$(basename "$f")
              new="${base%.deb}.${DISTRO}.deb"
              cp -v "$f" "out/bin/$new"
            done

            # Source packages (.dsc, .orig.tar.xz, .debian.tar.xz)
            for f in ./*.dsc ./*.orig.tar.* ./*.debian.tar.*; do
              [ -e "$f" ] || continue
              cp -v "$f" "out/src/"
            done
          fi

          ls -la out/bin || true
          ls -la out/src || true

      - name: Upload binary packages
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.distro }}-${{ matrix.arch }}
          path: out/bin/*
          if-no-files-found: error

      - name: Upload source packages
        uses: actions/upload-artifact@v4
        with:
          name: src-${{ matrix.distro }}-${{ matrix.arch }}
          path: out/src/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    env:
      DOCKER_CONFIG: /tmp/.docker

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ci-workflows
        uses: actions/checkout@v4
        with:
          repository: pkging/ci-workflows
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows

      - name: Preflight runner requirements
        run: bash .ci-workflows/hooks/preflight_in_runner.sh test "${{ matrix.arch }}"

      # ---------------------------------------------------------------
      # Download binary packages (RPM or DEB)
      # ---------------------------------------------------------------
      - name: Download binary packages
        uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.distro }}-${{ matrix.arch }}
          path: pkgs

      - name: List downloaded packages
        run: |
          echo "Downloaded packages:"
          ls -l pkgs || true

      - name: Map arch to platform
        id: platform
        run: |
          set -euo pipefail
          # source the helper from the checked-out ci-workflows
          source .ci-workflows/hooks/lib/platforms.sh

          if platform=$(map_arch_to_platform "${{ matrix.arch }}"); then
            echo "platform=$platform" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported arch: ${{ matrix.arch }}" >&2
            exit 1
          fi

      - name: Setup QEMU
        if: steps.platform.outputs.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.platform.outputs.platform }}

      - name: Runner test tools
        run: bash .ci-workflows/hooks/pre_test_in_runner.sh

      - name: Resolve container image
        id: image
        run: |
          set -euo pipefail
          source .ci-workflows/hooks/lib/container_images.sh
          image="$(get_container_image '${{ matrix.distro }}')"
          if [[ -z "$image" ]]; then
            echo "Container image mapping returned empty for distro: ${{ matrix.distro }}" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker config directory
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install & test package in container
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM:        ${{ steps.platform.outputs.platform }}
        run: |
          set -euo pipefail
          # Detect format based on downloaded files
          if ls pkgs/*.rpm >/dev/null 2>&1; then
            FORMAT="rpm"
          elif ls pkgs/*.deb >/dev/null 2>&1; then
            FORMAT="deb"
          else
            echo "❌ No RPM or DEB packages found in pkgs/" >&2
            exit 1
          fi

          TEST_SCRIPT="/workspace/.ci-workflows/hooks/test_in_container.sh"
          echo "Using test script: $TEST_SCRIPT"

          echo "Detected package format: $FORMAT"
          echo "Using test script: $TEST_SCRIPT"

          docker run --rm \
            --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            /bin/bash "$TEST_SCRIPT"
